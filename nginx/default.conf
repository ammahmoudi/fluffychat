server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # FluffyChat is a single-page app; unknown routes should fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Allow providing config.json at runtime (mount to /config/config.json)
  location = /config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Cache static assets (except config.json handled above)
  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|webp|ico|ttf|otf|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
